version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:6.0
    container_name: resqnet-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  # Backend API Server
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: resqnet-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/resqnet
      - JWT_SECRET=resqnet_docker_secret_key
      - JWT_EXPIRE=30d
    depends_on:
      - mongo
    restart: unless-stopped

  # Frontend React App (served via Nginx in Docker)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resqnet-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
